<!DOCTYPE html>
<html lang="en">

<head>
  <!--
    Tab Mode bot page. Loaded only inside the Tab Mode iframe as bot.html?bot=1&v=<build>.
    Intentionally has NO service worker registration and NO update notification:
    the parent client owns updates. Do not add them here.
  -->
  <meta charset="utf-8" />
  <title>FX Bot</title>
  <meta name="viewport" content="width=device-width, maximum-scale=1">
  <meta name="robots" content="noindex">
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="main.css?buildTimestamp">
  <style>
    html,
    body {
      overflow: hidden;
      padding: 0;
      margin: 0;
      background: rgb(0, 0, 0);
      color: rgb(255, 255, 255);
    }

    * {
      box-sizing: border-box;
    }

    a {
      color: rgb(225, 225, 255);
    }
  </style>
  <script>
    // Give the bot its own account/settings storage. The game stores account
    // credentials in localStorage (keys like v121/d121); without a namespace the
    // main client and the bot would keep overwriting each other's account.
    // This runs before any game/FX script, so every localStorage access in the
    // iframe goes through the prefixed view. Log in once in the bot and it
    // survives reloads independently from the main account.
    (function () {
      try {
        var real = window.localStorage;
        var prefix = "fxbot::";
        function namespacedKeys() {
          var result = [];
          for (var index = 0; index < real.length; index++) {
            var key = real.key(index);
            if (key && key.indexOf(prefix) === 0) result.push(key);
          }
          return result;
        }
        var storage = {
          get length() {
            return namespacedKeys().length;
          },
          key: function (index) {
            var keys = namespacedKeys();
            if (index < 0 || index >= keys.length) return null;
            return keys[index].slice(prefix.length);
          },
          getItem: function (key) {
            return real.getItem(prefix + String(key));
          },
          setItem: function (key, value) {
            real.setItem(prefix + String(key), String(value));
          },
          removeItem: function (key) {
            real.removeItem(prefix + String(key));
          },
          clear: function () {
            namespacedKeys().forEach(function (key) {
              real.removeItem(key);
            });
          }
        };
        Object.defineProperty(window, "localStorage", {
          configurable: true,
          get: function () {
            return storage;
          }
        });
      } catch (_error) {}
    })();
  </script>
  <script>
    // Guarantee the bot flag even if the page is opened/reloaded without it,
    // so the bundle never boots as a full client here.
    (function () {
      try {
        var url = new URL(location.href);
        if (url.searchParams.get("bot") !== "1") {
          url.searchParams.set("bot", "1");
          history.replaceState(null, "", url.href);
        }
      } catch (_error) {}
    })();
  </script>
</head>

<body onload="aiCommand746(0);">
  <canvas id="canvasA" width="128" height="128"></canvas>
  <span id="windowContainer">
    <div class="window flex-column settings" style="display:none">
      <h1>Settings</h1>
      <div class="scrollable"></div>
      <hr>
      <footer>
        <button onclick="__fx.settingsManager.resetAll()">Reset Settings</button>
        <button onclick="__fx.settingsManager.save()">Save Settings</button>
        <button onclick="__fx.settingsManager.importFromFile()">Import</button>
        <button onclick="__fx.settingsManager.exportToFile()">Export</button>
      </footer>
    </div>
    <div class="window flex-column" id="customLobbyJoinMenu" style="display: none">
      <input type="text" id="lobbyCode" placeholder="Enter lobby code">
      or
      <div>
        <button id="createLobbyButton">Create new lobby</button>
        <label for="region">in region:</label>
        <select id="customLobbyRegion" name="region">
          <option value="default" selected>Automatic (closest to you)</option>
          <option value="wnam">Western North America</option>
          <option value="enam">Eastern North America</option>
          <option value="weur">Western Europe</option>
          <option value="eeur">Eastern Europe</option>
          <option value="apac">Asia-Pacific</option>
          <option value="oc">Oceania</option>
        </select>
      </div>
    </div>
    <div class="window scrollable selectable" id="playerlist" style="display: none;">
      <h1>Player List</h1>
      <table>
        <tbody id="playerlist_content"></tbody>
      </table>
    </div>
    <div class="window scrollable selectable" id="donationhistory" style="display:none">
      <h1>Donation history for </h1>
      <p id="donationhistory_note">Note: donations from bots are not shown here</p>
      <table>
        <tbody id="donationhistory_content"></tbody>
      </table>
    </div>
  </span>
  <script src="variables.js?buildTimestamp"></script>
  <script src="fx.bundle.js?buildTimestamp"></script>
  <script src="game.js?buildTimestamp"></script>
</body>

</html>
